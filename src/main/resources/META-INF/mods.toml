modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# This mod is client+server: the slot lives on the server side, the hotkey is client only.
displayTest="MATCH_VERSION"

# No access transformers.
accessTransformers=[]

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios owns the slot definition and the inventory capability this mod reads.
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[${curios_version},)"
    ordering="AFTER"
    side="BOTH"
